spring.application.name=jarana-sabores-web
server.port=8081
server.address=0.0.0.0

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/restaurante_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.write-dates-as-timestamps=false

server.servlet.session.timeout=30m

# Copias de seguridad administradas desde el panel web
app.backup.directory=${BACKUP_DIR:backups}
app.backup.mysqldump=${MYSQLDUMP_PATH:mysqldump}
app.backup.mysql=${MYSQL_PATH:mysql}

# Logs (Logback): consola + archivo con rotación automática
logging.level.root=INFO
logging.level.pe.edu.utp.jarana=INFO
logging.file.name=${LOG_FILE:logs/jarana.log}
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=100MB
# [usuario] = quién ejecutó la acción (lo agrega LogContextoFilter)
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{usuario:-sistema}] %logger{36} - %msg%n

# Seguridad de la sesión y de los errores
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Cuenta de administrador inicial (se crea solo si no existe). Para no dejar la clave en el código,
# puedes definirla con las variables de entorno ADMIN_USER, ADMIN_NOMBRE y ADMIN_PASSWORD.
app.admin.usuario=${ADMIN_USER:Esperanza}
app.admin.nombre=${ADMIN_NOMBRE:Esperanza}
app.admin.password=${ADMIN_PASSWORD:70619457}
