<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña | La Jarana de Sabores</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/app.css"></head><body class="bg-light"><main class="container min-vh-100 d-flex align-items-center justify-content-center py-4"><section class="section-card p-4 p-md-5" style="max-width:520px;width:100%"><div class="text-center mb-4"><div class="brand-mark mx-auto mb-3">JS</div><h2 class="fw-bold">Actualiza tu contraseña</h2><p class="text-muted mb-0">Por seguridad, cambia la contraseña temporal antes de continuar.</p></div><form id="cambioForm"><div class="mb-3"><label class="form-label">Contraseña actual</label><input id="actual" type="password" class="form-control form-control-lg" required></div><div class="mb-3"><label class="form-label">Nueva contraseña</label><input id="nueva" type="password" minlength="8" maxlength="72" class="form-control form-control-lg" required><div class="form-text">Mínimo 8 caracteres.</div></div><div class="mb-4"><label class="form-label">Confirmar nueva contraseña</label><input id="confirmacion" type="password" minlength="8" maxlength="72" class="form-control form-control-lg" required></div><button class="btn btn-jarana btn-lg w-100">Guardar nueva contraseña</button></form><div class="text-center mt-3"><a href="/logout" class="small text-muted">Cerrar sesión</a></div></section></main><script src="/js/api.js"></script><script src="/js/cambiar-password.js"></script></body></html>
