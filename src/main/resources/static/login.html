<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | La Jarana de Sabores</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/app.css"></head><body class="login-page">
<div class="login-panel"><section class="login-visual"><div class="login-logo">JS</div><p class="text-uppercase small fw-bold opacity-75">Sistema de gestión de pedidos</p><h1>La Jarana<br>de Sabores</h1><p class="mt-4 fs-5 opacity-75">Gestiona pedidos, cocina, cobros, catálogo y reportes desde una sola plataforma.</p></section>
<section class="login-form"><div><p class="text-jarana fw-bold mb-2">BIENVENIDO</p><h2 class="fw-bold mb-2">Iniciar sesión</h2><p class="text-muted mb-4">Ingresa con tu cuenta asignada.</p><div id="msg"></div><form method="post" action="/login"><div class="mb-3"><label class="form-label">Usuario</label><input class="form-control form-control-lg" name="username" autocomplete="username" required></div><div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control form-control-lg" name="password" autocomplete="current-password" required></div><button class="btn btn-jarana btn-lg w-100">Ingresar al sistema</button></form><div class="demo-box mt-4"><b>Usuarios de demostración</b><br>admin / admin123 &nbsp; · &nbsp; cajero / cajero123 &nbsp; · &nbsp; cocina / cocina123</div></div></section></div>
<script>const q=new URLSearchParams(location.search);if(q.has('error'))msg.innerHTML='<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>';if(q.has('logout'))msg.innerHTML='<div class="alert alert-success">Sesión cerrada correctamente.</div>';</script></body></html>
